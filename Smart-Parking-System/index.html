<!DOCTYPE html>
<html>
<head>
<title>Smart Parking System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🚗 Smart Parking Management System</h1>

<div class="form">

<input
type="text"
id="vehicleNo"
placeholder="Vehicle Number">

<button onclick="parkVehicle()">
Park Vehicle
</button>

</div>

<h2>
Available Slots:
<span id="availableSlots">20</span>
</h2>

<input
type="text"
id="search"
placeholder="Search Vehicle"
onkeyup="renderVehicles()">

<div id="vehicleList"></div>

<script src="script.js"></script>

</body>
</html>
